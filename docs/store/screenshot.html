<!doctype html>
<html>
<head><meta charset="utf-8"><title>KTX Driver screenshot</title>
<link rel="stylesheet" href="screenshot.css"></head>
<body>
  <!-- Filled from the query string by build_graphics.ps1: ?img=...&h=...&p=...&lang=... -->
  <div class="caption"><h1 id="h"></h1><p id="p"></p></div>
  <div class="phone"><div class="screen"><img id="img" alt=""></div></div>
  <div class="stripe"></div>
  <script>
    var q = new URLSearchParams(location.search);
    document.getElementById('img').src = 'img/' + q.get('img');
    document.getElementById('h').innerHTML = q.get('h');
    document.getElementById('p').textContent = q.get('p');
    if (q.get('lang') === 'ko') document.body.style.fontFamily = '"Malgun Gothic", "Segoe UI", sans-serif';
  </script>
</body>
</html>
